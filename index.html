<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>40-Day Lock-In</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,900;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

:root{
  --ink:#14161B;
  --panel:#1C1F26;
  --panel-2:#20242C;
  --line:#2C2F37;
  --paper:#ECE6D6;
  --paper-dim:#8F8A7C;
  --gold:#C9A227;
  --gold-soft:#E4C766;
  --miss:#54423C;
  --radius:10px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--ink);color:var(--paper);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 60px;}

/* ---------- Hero ---------- */
.hero{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:26px;}
.hero-title{font-family:'Fraunces',serif;font-weight:900;font-style:italic;font-size:clamp(28px,4vw,42px);letter-spacing:-0.01em;margin:0;color:var(--paper);}
.hero-sub{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold-soft);margin-top:6px;}
.day-counter{text-align:right;}
.day-counter .num{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(36px,6vw,56px);color:var(--gold);line-height:1;}
.day-counter .label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.12em;color:var(--paper-dim);text-transform:uppercase;}

/* tally marks signature */
.tally{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;max-width:320px;justify-content:flex-end;}
.tally-group{display:flex;position:relative;width:18px;height:22px;}
.tally-group svg{width:100%;height:100%;}
.tally-group line{stroke:var(--line);stroke-width:2;transition:stroke .3s;}
.tally-group.filled line{stroke:var(--gold);}
.tally-group.filled line.slash{stroke:var(--gold-soft);}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:2px;margin-bottom:22px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;width:fit-content;}
.tab-btn{background:var(--panel);color:var(--paper-dim);border:none;padding:10px 20px;font-family:'Inter',sans-serif;font-weight:600;font-size:13px;cursor:pointer;letter-spacing:0.02em;}
.tab-btn.active{background:var(--gold);color:#1a1400;}
.view{display:none;}
.view.active{display:block;}

/* ---------- Controls ---------- */
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px;}
.controls label{font-size:12px;color:var(--paper-dim);letter-spacing:0.04em;text-transform:uppercase;margin-right:6px;}
input[type=date], input[type=text]{
  background:var(--panel);border:1px solid var(--line);color:var(--paper);
  padding:9px 12px;border-radius:8px;font-family:'Inter',sans-serif;font-size:13px;
}
input[type=text]{min-width:200px;}
input:focus{outline:2px solid var(--gold);outline-offset:1px;}
.btn{background:var(--gold);color:#1a1400;border:none;padding:9px 16px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;}
.btn:hover{background:var(--gold-soft);}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--paper-dim);}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold-soft);}
.btn.danger{background:transparent;border:1px solid var(--miss);color:#c98b7c;}

/* ---------- Stats ---------- */
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:22px;}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;min-width:120px;}
.stat .v{font-family:'Fraunces',serif;font-weight:900;font-size:24px;color:var(--gold-soft);}
.stat .l{font-size:11px;color:var(--paper-dim);text-transform:uppercase;letter-spacing:0.08em;margin-top:2px;}

/* ---------- Grid ---------- */
.grid-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);}
table.lockgrid{border-collapse:collapse;width:100%;}
table.lockgrid th, table.lockgrid td{border-bottom:1px solid var(--line);text-align:center;padding:0;}
table.lockgrid thead th{
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--paper-dim);
  padding:10px 4px;font-weight:600;position:sticky;top:0;background:var(--panel-2);
}
.habit-col{position:sticky;left:0;background:var(--panel-2);text-align:left !important;padding:12px 14px !important;min-width:170px;z-index:2;border-right:1px solid var(--line);}
.habit-name{font-weight:600;font-size:13.5px;}
.habit-row-actions{display:flex;gap:6px;align-items:center;}
.remove-habit{background:none;border:none;color:var(--paper-dim);cursor:pointer;font-size:14px;opacity:.5;}
.remove-habit:hover{opacity:1;color:#c98b7c;}
.cell-btn{
  width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:transparent;
  cursor:pointer;margin:6px auto;display:block;position:relative;transition:all .15s;
}
.cell-btn:hover{border-color:var(--gold-soft);}
.cell-btn.done{background:var(--gold);border-color:var(--gold);}
.cell-btn.done::after{
  content:'';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
}
.cell-btn.done svg{position:absolute;inset:0;margin:auto;width:16px;height:16px;}
.daynum{font-size:9px;color:var(--paper-dim);display:block;margin-top:1px;}

.empty-state{padding:40px 20px;text-align:center;color:var(--paper-dim);font-size:14px;}
.empty-state b{color:var(--gold-soft);}

/* ---------- Weekly ---------- */
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;}
@media(max-width:900px){.week-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:520px){.week-grid{grid-template-columns:1fr;}}
.day-col{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px;min-height:180px;}
.day-col h3{font-family:'Fraunces',serif;font-weight:600;font-style:italic;margin:0 0 4px;font-size:17px;color:var(--gold-soft);border-bottom:1px solid var(--line);padding-bottom:8px;}
.task-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;}
.task-item input[type=checkbox]{margin-top:2px;accent-color:var(--gold);width:14px;height:14px;flex-shrink:0;}
.task-item span{flex:1;line-height:1.4;}
.task-item.checked span{color:var(--paper-dim);text-decoration:line-through;}
.task-item button{background:none;border:none;color:var(--paper-dim);cursor:pointer;font-size:13px;opacity:.4;padding:0;}
.task-item button:hover{opacity:1;color:#c98b7c;}
.add-task-row{display:flex;gap:6px;margin-top:auto;}
.add-task-row input{flex:1;min-width:0;padding:7px 9px;font-size:12px;}
.add-task-row button{background:var(--gold);border:none;color:#1a1400;border-radius:6px;width:26px;height:26px;font-weight:700;cursor:pointer;flex-shrink:0;}

.footer-note{margin-top:30px;font-size:11.5px;color:var(--paper-dim);text-align:center;font-family:'JetBrains Mono',monospace;}
.loading{padding:60px;text-align:center;color:var(--paper-dim);font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;}

/* ---------- Sync ---------- */
.sync-bar{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.sync-toggle{background:var(--panel);border:1px solid var(--line);color:var(--paper);padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
.sync-toggle:hover{border-color:var(--gold-soft);}
.sync-badge{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.05em;color:var(--paper-dim);}
.sync-badge.idle{color:var(--gold-soft);}
.sync-badge.error{color:#c98b7c;}
.sync-badge.syncing{color:var(--paper-dim);}
.sync-panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:20px;}
.sync-copy{font-size:13px;line-height:1.6;color:var(--paper-dim);margin:0 0 16px;}
.sync-copy a{color:var(--gold-soft);}
.sync-copy b{color:var(--paper);}
.sync-block{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line);}
.sync-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.sync-block-title{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--paper-dim);margin-bottom:8px;}
.sync-block input{width:100%;margin-bottom:8px;}
.sync-id-row{display:flex;gap:8px;align-items:center;}
.sync-id-row code{background:var(--ink);border:1px solid var(--line);padding:8px 10px;border-radius:6px;font-size:12px;color:var(--gold-soft);flex:1;overflow-x:auto;white-space:nowrap;}

/* ---------- Mobile ---------- */
@media(max-width:640px){
  .wrap{padding:16px 12px 40px;}
  .hero{flex-direction:column;align-items:flex-start;gap:14px;padding-bottom:16px;margin-bottom:18px;}
  .day-counter{text-align:left;align-self:stretch;}
  .tally{justify-content:flex-start;}
  .tabs{width:100%;}
  .tab-btn{flex:1;padding:11px 10px;font-size:12.5px;}
  .controls{flex-direction:column;align-items:stretch;gap:10px;}
  .controls > div{display:flex;flex-direction:column;align-items:stretch !important;gap:6px;width:100%;}
  .controls > div > div{display:flex;gap:8px;}
  input[type=date], input[type=text]{width:100%;min-width:0;}
  .controls .btn{width:100%;}
  .stats{gap:10px;}
  .stat{flex:1 1 calc(50% - 10px);min-width:0;padding:12px 14px;}
  .habit-col{min-width:130px;padding:10px 10px !important;}
  .habit-name{font-size:12.5px;}
  .cell-btn{width:26px;height:26px;margin:5px auto;}
  table.lockgrid thead th{padding:8px 3px;font-size:10px;min-width:26px;}
  .grid-scroll{-webkit-overflow-scrolling:touch;}
  .week-grid{gap:10px;}
  .day-col{padding:12px;min-height:auto;}
  .footer-note br{display:none;}
  .sync-bar{flex-wrap:wrap;}
  .sync-id-row{flex-direction:column;align-items:stretch;}
  .sync-id-row code{white-space:normal;word-break:break-all;}
}
@media(max-width:400px){
  .hero-title{font-size:30px;}
  .day-counter .num{font-size:34px;}
}
</style>
</head>
<body>
<noscript>
  <div class="wrap"><div class="loading">This tracker needs JavaScript. Please open it in Safari (not a Mail/WhatsApp preview) — tap Share → Open in Safari.</div></div>
</noscript>
<div class="wrap" id="app">
  <div class="loading">Opening the ledger…</div>
</div>
<script>
  setTimeout(function(){
    var el = document.getElementById('app');
    if(el && el.innerHTML.indexOf('Opening the ledger') !== -1){
      el.innerHTML = '<div class="loading">This viewer is blocking scripts.<br><br>Tap Share → Open in Safari, then try again.</div>';
    }
  }, 4000);
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const STORAGE_KEY = 'lockin-data';
const SCHEDULE_KEY = 'weekly-schedule';
const SYNC_CONFIG_KEY = 'lockin-sync-config';
const TOTAL_DAYS = 40;
const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAY_SHORT = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const SUPABASE_TABLE = 'lockin_sync';

let state = {
  startDate: null,
  habits: [],           // [{id, name}]
  checks: {}            // { habitId: [bool x40] }
};
let schedule = {}; // { SUN: [{id,text,done}], ... }
let activeTab = 'lockin';
// syncConfig.syncId is a shared "room code" — any device with the same
// Supabase URL + anon key + syncId reads/writes the same row.
let syncConfig = { supabaseUrl: null, supabaseKey: null, syncId: null, lastSyncedAt: null };
let syncStatus = 'idle'; // idle | syncing | error | offline
let syncPanelOpen = false;
let pushTimer = null;
let pollTimer = null;
let supabaseClient = null;

function getSupabaseClient(){
  if(!syncConfig.supabaseUrl || !syncConfig.supabaseKey) return null;
  if(!supabaseClient || supabaseClient._url !== syncConfig.supabaseUrl || supabaseClient._key !== syncConfig.supabaseKey){
    supabaseClient = window.supabase.createClient(syncConfig.supabaseUrl, syncConfig.supabaseKey);
    supabaseClient._url = syncConfig.supabaseUrl;
    supabaseClient._key = syncConfig.supabaseKey;
  }
  return supabaseClient;
}

function uid(){ return Math.random().toString(36).slice(2,9); }

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) state = JSON.parse(raw);
  }catch(e){ console.error('load failed', e); }
  if(!state.startDate) state.startDate = new Date().toISOString().slice(0,10);
  if(!state.habits) state.habits = [];
  if(!state.checks) state.checks = {};

  try{
    const raw2 = localStorage.getItem(SCHEDULE_KEY);
    if(raw2) schedule = JSON.parse(raw2);
  }catch(e){ console.error('load failed', e); }
  DAY_SHORT.forEach(d=>{ if(!schedule[d]) schedule[d] = []; });

  try{
    const raw3 = localStorage.getItem(SYNC_CONFIG_KEY);
    if(raw3) syncConfig = JSON.parse(raw3);
  }catch(e){ console.error('load failed', e); }

  render();

  if(syncConfig.supabaseUrl && syncConfig.supabaseKey && syncConfig.syncId){
    pullFromCloud(true);
    startPolling();
  }
}

function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error('save failed', e); alert('Could not save — your browser storage may be full or blocked.'); }
  queueCloudPush();
}
function saveSchedule(){
  try{ localStorage.setItem(SCHEDULE_KEY, JSON.stringify(schedule)); }
  catch(e){ console.error('save failed', e); alert('Could not save — your browser storage may be full or blocked.'); }
  queueCloudPush();
}
function saveSyncConfig(){
  try{ localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(syncConfig)); }
  catch(e){ console.error('save failed', e); }
}

/* ---------- Cloud sync (Supabase) ---------- */

function queueCloudPush(){
  if(!syncConfig.supabaseUrl || !syncConfig.supabaseKey || !syncConfig.syncId) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushToCloud, 900);
}

async function pushToCloud(){
  const client = getSupabaseClient();
  if(!client || !syncConfig.syncId) return;
  syncStatus = 'syncing'; renderSyncBadge();
  try{
    const { error } = await client
      .from(SUPABASE_TABLE)
      .upsert({ id: syncConfig.syncId, state, schedule, updated_at: new Date().toISOString() });
    if(error) throw error;
    syncConfig.lastSyncedAt = new Date().toISOString();
    saveSyncConfig();
    syncStatus = 'idle';
  }catch(e){
    console.error(e);
    syncStatus = 'error';
  }
  renderSyncBadge();
}

async function pullFromCloud(silent){
  const client = getSupabaseClient();
  if(!client || !syncConfig.syncId) return;
  syncStatus = 'syncing'; renderSyncBadge();
  try{
    const { data, error } = await client
      .from(SUPABASE_TABLE)
      .select('state, schedule')
      .eq('id', syncConfig.syncId)
      .maybeSingle();
    if(error) throw error;
    if(data){
      if(data.state) state = data.state;
      if(data.schedule) schedule = data.schedule;
    }
    if(!state.startDate) state.startDate = new Date().toISOString().slice(0,10);
    if(!state.habits) state.habits = [];
    if(!state.checks) state.checks = {};
    DAY_SHORT.forEach(d=>{ if(!schedule[d]) schedule[d] = []; });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    localStorage.setItem(SCHEDULE_KEY, JSON.stringify(schedule));
    syncConfig.lastSyncedAt = new Date().toISOString();
    saveSyncConfig();
    syncStatus = 'idle';
    render();
  }catch(e){
    console.error(e);
    syncStatus = 'error';
    if(!silent) alert('Could not reach Supabase. Check your project URL, anon key, and internet connection.');
    renderSyncBadge();
  }
}

function startPolling(){
  clearInterval(pollTimer);
  pollTimer = setInterval(()=>{ if(document.visibilityState === 'visible') pullFromCloud(true); }, 25000);
}

document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && syncConfig.supabaseUrl && syncConfig.syncId) pullFromCloud(true);
});

async function createSync(urlInput, keyInput){
  const supabaseUrl = urlInput.trim().replace(/\/$/, '');
  const supabaseKey = keyInput.trim();
  if(!supabaseUrl || !supabaseKey){ alert('Paste your Supabase Project URL and anon key first.'); return; }
  if(!window.supabase){ alert('Supabase client failed to load. Check your connection and reload.'); return; }
  const syncId = uid() + uid();
  syncConfig = { supabaseUrl, supabaseKey, syncId, lastSyncedAt: null };
  supabaseClient = null;
  saveSyncConfig();
  syncStatus = 'syncing'; renderSyncBadge();
  const client = getSupabaseClient();
  try{
    const { error } = await client
      .from(SUPABASE_TABLE)
      .upsert({ id: syncId, state, schedule, updated_at: new Date().toISOString() });
    if(error) throw error;
    syncConfig.lastSyncedAt = new Date().toISOString();
    saveSyncConfig();
    syncStatus = 'idle';
    startPolling();
    render();
  }catch(e){
    console.error(e);
    alert('Could not create a sync row. Double check your Supabase URL/key and that the ' + SUPABASE_TABLE + ' table exists (see README).');
    syncConfig = { supabaseUrl: null, supabaseKey: null, syncId: null, lastSyncedAt: null };
    saveSyncConfig();
    syncStatus = 'error';
    render();
  }
}

async function connectSync(urlInput, keyInput, syncIdInput){
  const supabaseUrl = urlInput.trim().replace(/\/$/, '');
  const supabaseKey = keyInput.trim();
  const syncId = syncIdInput.trim();
  if(!supabaseUrl || !supabaseKey || !syncId){ alert('Paste the Supabase URL, anon key, and the sync code from your other device.'); return; }
  if(!window.supabase){ alert('Supabase client failed to load. Check your connection and reload.'); return; }
  syncConfig = { supabaseUrl, supabaseKey, syncId, lastSyncedAt: null };
  supabaseClient = null;
  saveSyncConfig();
  await pullFromCloud(false);
  startPolling();
  render();
}

function disconnectSync(){
  if(!confirm('Disconnect this device from sync? Your data stays on this device, but it will stop updating from your other devices.')) return;
  clearInterval(pollTimer);
  syncConfig = { supabaseUrl: null, supabaseKey: null, syncId: null, lastSyncedAt: null };
  supabaseClient = null;
  saveSyncConfig();
  render();
}

function toggleSyncPanel(){ syncPanelOpen = !syncPanelOpen; render(); }

function renderSyncBadge(){
  const el = document.getElementById('syncBadge');
  if(!el) return;
  const map = {
    idle: syncConfig.syncId ? '● Synced' : '○ Not synced',
    syncing: '◌ Syncing…',
    error: '● Sync error',
    offline: '○ Offline'
  };
  el.textContent = map[syncStatus] || '';
  el.className = 'sync-badge ' + syncStatus;
}

function exportBackup(){
  const payload = { state, schedule, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `lockin-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const payload = JSON.parse(e.target.result);
      if(payload.state) state = payload.state;
      if(payload.schedule) schedule = payload.schedule;
      saveState(); saveSchedule(); render();
      alert('Backup restored.');
    }catch(err){ alert('That file could not be read as a backup.'); }
  };
  reader.readAsText(file);
}

function dayIndexToday(){
  const start = new Date(state.startDate + 'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  const diff = Math.floor((now - start) / 86400000) + 1;
  return diff;
}

function computeStats(){
  const habits = state.habits;
  let totalCells = habits.length * TOTAL_DAYS;
  let doneCells = 0;
  habits.forEach(h=>{
    (state.checks[h.id]||[]).forEach(v=>{ if(v) doneCells++; });
  });
  const pct = totalCells ? Math.round((doneCells/totalCells)*100) : 0;

  // streak: consecutive days (from day 1) where ALL habits checked
  let streak = 0;
  if(habits.length){
    for(let d=0; d<TOTAL_DAYS; d++){
      const allDone = habits.every(h => (state.checks[h.id]||[])[d]);
      if(allDone) streak++; else break;
    }
  }
  return {pct, doneCells, totalCells, streak};
}

function toggleCheck(habitId, dayIdx){
  if(!state.checks[habitId]) state.checks[habitId] = new Array(TOTAL_DAYS).fill(false);
  state.checks[habitId][dayIdx] = !state.checks[habitId][dayIdx];
  saveState();
  render();
}

function addHabit(name){
  if(!name.trim()) return;
  const id = uid();
  state.habits.push({id, name: name.trim()});
  state.checks[id] = new Array(TOTAL_DAYS).fill(false);
  saveState();
  render();
}
function removeHabit(id){
  state.habits = state.habits.filter(h=>h.id!==id);
  delete state.checks[id];
  saveState();
  render();
}

function addTask(dayKey, text){
  if(!text.trim()) return;
  schedule[dayKey].push({id: uid(), text: text.trim(), done:false});
  saveSchedule();
  render();
}
function toggleTask(dayKey, id){
  const t = schedule[dayKey].find(x=>x.id===id);
  if(t) t.done = !t.done;
  saveSchedule();
  render();
}
function removeTask(dayKey, id){
  schedule[dayKey] = schedule[dayKey].filter(x=>x.id!==id);
  saveSchedule();
  render();
}
function resetWeekTicks(){
  DAY_SHORT.forEach(d=> schedule[d].forEach(t=> t.done=false));
  saveSchedule();
  render();
}

function tallySVG(filled){
  return `<svg viewBox="0 0 18 22">
    <line class="${filled?'':''}" x1="2" y1="2" x2="2" y2="20"></line>
    <line x1="6" y1="2" x2="6" y2="20"></line>
    <line x1="10" y1="2" x2="10" y2="20"></line>
    <line x1="14" y1="2" x2="14" y2="20"></line>
    <line class="slash" x1="0" y1="20" x2="16" y2="2"></line>
  </svg>`;
}

function renderTally(streak){
  const groups = Math.ceil(TOTAL_DAYS/5);
  let html = '';
  for(let g=0; g<groups; g++){
    const filled = (g+1)*5 <= streak;
    html += `<div class="tally-group ${filled?'filled':''}">${tallySVG(filled)}</div>`;
  }
  return html;
}

function checkIconSVG(){
  return `<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 11.5L13 4.5" stroke="#1a1400" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function render(){
  const app = document.getElementById('app');
  const stats = computeStats();
  const today = dayIndexToday();

  let habitRows = '';
  if(state.habits.length === 0){
    habitRows = '';
  } else {
    state.habits.forEach(h=>{
      const checks = state.checks[h.id] || new Array(TOTAL_DAYS).fill(false);
      let cells = '';
      for(let d=0; d<TOTAL_DAYS; d++){
        const isDone = checks[d];
        const isToday = (d+1) === today;
        cells += `<td>
          <button class="cell-btn ${isDone?'done':''}" style="${isToday && !isDone ? 'border-color:var(--gold-soft)' : ''}"
            onclick="toggleCheck('${h.id}', ${d})" aria-label="${h.name} day ${d+1}">
            ${isDone ? checkIconSVG() : ''}
          </button>
        </td>`;
      }
      habitRows += `<tr>
        <td class="habit-col">
          <div class="habit-row-actions">
            <span class="habit-name">${escapeHtml(h.name)}</span>
            <button class="remove-habit" onclick="removeHabit('${h.id}')" title="Remove">✕</button>
          </div>
        </td>
        ${cells}
      </tr>`;
    });
  }

  let headerCells = '';
  for(let d=1; d<=TOTAL_DAYS; d++){
    headerCells += `<th>${d}</th>`;
  }

  const lockinView = `
    <div class="controls">
      <div><label>Start date</label><input type="date" value="${state.startDate}" onchange="state.startDate=this.value; saveState(); render();"></div>
      <div style="display:flex;gap:8px;">
        <input type="text" id="newHabitInput" placeholder="e.g. No sugar, Gym, Read 20 pages" onkeydown="if(event.key==='Enter'){addHabit(this.value); this.value='';}">
        <button class="btn" onclick="const i=document.getElementById('newHabitInput'); addHabit(i.value); i.value='';">+ Add commitment</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="v">${today > 0 ? Math.min(today,TOTAL_DAYS) : '—'}/40</div><div class="l">Day of 40</div></div>
      <div class="stat"><div class="v">${stats.pct}%</div><div class="l">Marks kept</div></div>
      <div class="stat"><div class="v">${stats.streak}</div><div class="l">Day streak</div></div>
      <div class="stat"><div class="v">${state.habits.length}</div><div class="l">Commitments</div></div>
    </div>

    ${state.habits.length === 0 ? `
      <div class="grid-scroll">
        <div class="empty-state">No commitments yet. Add the <b>major things</b> you're locking in on above — one row per habit, 40 days across.</div>
      </div>
    ` : `
      <div class="grid-scroll">
        <table class="lockgrid">
          <thead><tr><th class="habit-col" style="background:var(--panel-2);">Commitment</th>${headerCells}</tr></thead>
          <tbody>${habitRows}</tbody>
        </table>
      </div>
    `}
  `;

  let weekCols = '';
  DAY_SHORT.forEach((key, idx)=>{
    const items = schedule[key] || [];
    let itemsHtml = items.map(t => `
      <div class="task-item ${t.done?'checked':''}">
        <input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${key}','${t.id}')">
        <span>${escapeHtml(t.text)}</span>
        <button onclick="removeTask('${key}','${t.id}')" title="Remove">✕</button>
      </div>`).join('');
    weekCols += `
      <div class="day-col">
        <h3>${DAY_NAMES[idx]}</h3>
        ${itemsHtml || '<div style="color:var(--paper-dim);font-size:12px;">Nothing scheduled</div>'}
        <div class="add-task-row">
          <input type="text" placeholder="Add a block…" onkeydown="if(event.key==='Enter'){addTask('${key}', this.value); this.value='';}">
          <button onclick="const i=this.previousElementSibling; addTask('${key}', i.value); i.value='';">+</button>
        </div>
      </div>`;
  });

  const weekView = `
    <div class="controls" style="justify-content:space-between;">
      <div style="color:var(--paper-dim);font-size:13px;">Your recurring week — Sunday through Saturday. Edit anytime; it carries forward every week.</div>
      <button class="btn ghost" onclick="resetWeekTicks()">Reset this week's ticks</button>
    </div>
    <div class="week-grid">${weekCols}</div>
  `;

  const isConnected = !!(syncConfig.supabaseUrl && syncConfig.supabaseKey && syncConfig.syncId);
  const lastSync = syncConfig.lastSyncedAt ? new Date(syncConfig.lastSyncedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : 'never';

  const syncPanel = !syncPanelOpen ? '' : `
    <div class="sync-panel">
      ${!isConnected ? `
        <p class="sync-copy">Connect a free <a href="https://supabase.com" target="_blank" rel="noopener">Supabase</a> project to sync this tracker across your devices. Create a project, run the setup SQL from the README, then copy your <b>Project URL</b> and <b>anon public key</b> from Project Settings → API.</p>

        <div class="sync-block">
          <div class="sync-block-title">First device — start a new sync</div>
          <input type="text" id="syncUrlNew" placeholder="Supabase Project URL (https://xxxx.supabase.co)">
          <input type="text" id="syncKeyNew" placeholder="Supabase anon public key">
          <button class="btn" onclick="createSync(document.getElementById('syncUrlNew').value, document.getElementById('syncKeyNew').value)">Create sync</button>
        </div>

        <div class="sync-block">
          <div class="sync-block-title">Other device — connect to existing sync</div>
          <input type="text" id="syncUrlExisting" placeholder="Same Supabase Project URL">
          <input type="text" id="syncKeyExisting" placeholder="Same anon public key">
          <input type="text" id="syncIdExisting" placeholder="Sync code from your first device">
          <button class="btn ghost" onclick="connectSync(document.getElementById('syncUrlExisting').value, document.getElementById('syncKeyExisting').value, document.getElementById('syncIdExisting').value)">Connect</button>
        </div>
      ` : `
        <p class="sync-copy">This device is syncing. Copy the sync code below and, along with your Supabase URL and anon key, paste all three into the <b>other device</b> under "connect to existing sync" — same steps, just the connect side.</p>
        <div class="sync-block">
          <div class="sync-block-title">Sync code</div>
          <div class="sync-id-row">
            <code id="syncIdDisplay">${syncConfig.syncId}</code>
            <button class="btn ghost" onclick="navigator.clipboard.writeText('${syncConfig.syncId}'); this.textContent='Copied!'; setTimeout(()=>this.textContent='Copy',1200);">Copy</button>
          </div>
          <div style="font-size:11.5px;color:var(--paper-dim);margin-top:4px;">Last synced: ${lastSync}</div>
        </div>
        <div class="controls" style="padding:0;margin:4px 0 0;">
          <button class="btn ghost" onclick="pullFromCloud(false)">Sync now</button>
          <button class="btn danger" onclick="disconnectSync()">Disconnect this device</button>
        </div>
      `}
    </div>
  `;

  app.innerHTML = `
    <div class="hero">
      <div>
        <p class="hero-sub">Discipline is remembered in marks, not words</p>
        <h1 class="hero-title">Locked In</h1>
      </div>
      <div class="day-counter">
        <div class="num">${today > 0 ? Math.min(today,TOTAL_DAYS) : '—'}<span style="font-size:20px;color:var(--paper-dim);">/40</span></div>
        <div class="label">${today > TOTAL_DAYS ? 'Cycle complete' : today <= 0 ? 'Not started' : 'Days in'}</div>
        <div class="tally">${renderTally(stats.streak)}</div>
      </div>
    </div>

    <div class="sync-bar">
      <button class="sync-toggle" onclick="toggleSyncPanel()">${isConnected ? '🔗' : '🔄'} ${isConnected ? 'Sync connected' : 'Set up sync'}</button>
      <span id="syncBadge" class="sync-badge ${syncStatus}">${isConnected ? '● Synced' : '○ Not synced'}</span>
    </div>
    ${syncPanel}

    <div class="tabs">
      <button class="tab-btn ${activeTab==='lockin'?'active':''}" onclick="activeTab='lockin'; render();">40-Day Lock-In</button>
      <button class="tab-btn ${activeTab==='week'?'active':''}" onclick="activeTab='week'; render();">Weekly Rhythm</button>
    </div>

    <div class="view active">
      ${activeTab === 'lockin' ? lockinView : weekView}
    </div>

    <div class="controls" style="justify-content:center;margin-top:10px;">
      <button class="btn ghost" onclick="exportBackup()">⭳ Download backup</button>
      <button class="btn ghost" onclick="document.getElementById('importFile').click()">⭱ Restore backup</button>
      <input type="file" id="importFile" accept="application/json" style="display:none" onchange="if(this.files[0]) importBackup(this.files[0]); this.value='';">
    </div>
    <div class="footer-note">Saved on this device${isConnected ? ' and synced to the cloud' : ''}. Download a backup now and then, just in case.</div>
  `;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.innerText = str;
  return d.innerHTML;
}

load();
</script>
</body>
</html>
